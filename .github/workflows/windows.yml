name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'assets/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore QuickTrans.sln
      - name: Build
        run: dotnet build QuickTrans.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/QuickTrans.Tests/QuickTrans.Tests.csproj -c Release --no-build
      - name: Verify self-contained publishing
        run: dotnet publish src/QuickTrans/QuickTrans.csproj -c Release -r win-x64 --self-contained true --no-restore
